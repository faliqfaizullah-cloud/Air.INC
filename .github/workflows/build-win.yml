name: Build Windows
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['windows/**', 'app/src/main/assets/**', '.github/workflows/build-win.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version from tag
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          # electron-builder wants x.y.z: pad "3.1" -> "3.1.0"
          if [[ "$V" =~ ^[0-9]+\.[0-9]+$ ]]; then V="$V.0"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Download lyric fonts (EB Garamond + Montserrat, OFL)
        shell: bash
        working-directory: .
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/EBGaramond.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf" || true
          curl -fsSL -o app/src/main/assets/fonts/Montserrat.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf" || true
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build installer + portable exe
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/prepare.js
          npx electron-builder --win --x64 --publish never -c.extraMetadata.version=${{ steps.v.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: Air.INC-windows
          path: |
            windows/dist/*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/dist/*.exe
